# Optional second track: general instruct (often better on HumanEval transfer).
model_name: "Qwen/Qwen2.5-7B-Instruct"

dataset: "gsm8k"
train_subset_size: 2000
eval_subset_size: 200

use_qlora: true
torch_dtype: "bfloat16"
checkpoint_path: "checkpoints/grpo_qwen25_7b/final"
eval_output_dir: "results/eval_qwen25_7b"

max_steps: 5
max_tokens_per_step: 512
disable_tools: false

num_rollouts_per_problem: 8
lambda_cost: 1.0e-5
mu_tool: 0.05
kl_coef: 0.0
learning_rate: 1.0e-6
num_epochs: 5
batch_size: 1
gradient_accumulation_steps: 8
lora_rank: 16
lora_alpha: 32

self_consistency_k: 5
