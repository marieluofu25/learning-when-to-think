model_name: "Qwen/Qwen2.5-0.5B-Instruct"

# Dataset
dataset: "gsm8k"
train_subset_size: 200
eval_subset_size: 100

# Adaptive policy
max_steps: 5
actions:
  - "continue"
  - "terminate"

# GRPO training
num_rollouts_per_problem: 4
lambda_cost: 0.1
max_tokens_per_step: 256
learning_rate: 1.0e-4
num_epochs: 3
batch_size: 2
gradient_accumulation_steps: 4
lora_rank: 16
lora_alpha: 32

# Evaluation
eval_batch_size: 4
self_consistency_k: 5
