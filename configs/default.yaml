model_name: "Qwen/Qwen2.5-Math-7B-Instruct"

# Dataset: MATH-500 only (HuggingFaceH4/MATH-500)
dataset: "math_500"
train_subset_size: 200
eval_subset_size: 100

# Training / eval
use_qlora: false
torch_dtype: "float16"
checkpoint_path: "checkpoints/grpo/final"
sft_checkpoint: "checkpoints/sft/final"
eval_output_dir: "results/eval"

# Adaptive policy (continue / refine / terminate)
max_steps: 5
max_tokens_per_step: 256
allow_refine: true
direct_max_tokens: 64
humaneval_max_tokens: 512

# GRPO + ALP + DeGRPO
num_rollouts_per_problem: 4
# ALP: reward = r_acc - beta * max(0, SR) * (n_tokens / L_max); L_max defaults to max_steps * max_tokens_per_step if omitted
beta: 0.02
L_max: null
# DeGRPO: weighted log-probs on action-prefix vs rest; set false for vanilla GRPO on all tokens
degrpo: true
n_control_tokens: 16
w_ctrl: 2.0
w_resp: 1.0
# Optional logging-only format score (not added to ALP reward when 0)
format_bonus: 0.0
kl_coef: 0.0
learning_rate: 1.0e-4
num_epochs: 3
batch_size: 2
gradient_accumulation_steps: 4
lora_rank: 16
lora_alpha: 32

# Evaluation
self_consistency_k: 5
