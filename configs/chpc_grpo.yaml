model_name: "Qwen/Qwen2.5-Math-7B-Instruct"

# Prefer export HF_TOKEN in chpc/env_local.sh. Or: hf_token_file: "$HOME/.cache/huggingface/token"
hf_token: null
hf_token_file: null

dataset: "math_500"
# Balanced CHPC profile (~4-6 hour target on H200): enough signal for visible learning.
train_subset_size: 64
eval_subset_size: 64

use_qlora: true
torch_dtype: "bfloat16"
checkpoint_path: "chpc/results/checkpoints/grpo/final"
eval_output_dir: "chpc/results/eval/latest"

max_steps: 3
max_tokens_per_step: 512
allow_refine: false
constrain_action_first_token: false

num_rollouts_per_problem: 4
beta: 0.02
L_max: null
degrpo: true
w_ctrl: 2.0
w_resp: 1.0
format_bonus: 0.0
kl_coef: 0.0
learning_rate: 5.0e-6
num_epochs: 3
batch_size: 1
gradient_accumulation_steps: 4
lora_rank: 16
lora_alpha: 32

self_consistency_k: 5
