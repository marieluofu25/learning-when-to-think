# Copy to configs/hf_secrets.yaml (gitignored). Paste the hf_* lines into your real config
# (e.g. chpc_grpo.yaml), or keep a separate YAML and merge keys by hand — this repo does
# not auto-merge multiple YAML files.
#
# Safer than hf_token: put the token in a chmod-600 file and use hf_token_file.

hf_token: null
hf_token_file: "${HOME}/.cache/huggingface/token"
